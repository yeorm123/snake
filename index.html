<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포즈 뱀게임</title>
<style>
  :root { --bg:#111827; --panel:#1f2937; --text:#e5e7eb; --muted:#9ca3af; --accent:#22c55e; --food:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, "Malgun Gothic", sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { margin:8px 0 16px; font-size:24px; }
  .wrap { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
  .panel { background:var(--panel); border-radius:12px; padding:16px; }
  #game { background:#0b1220; border-radius:8px; display:block; }
  #webcam-container canvas { border-radius:8px; display:block; }
  .side { width:300px; display:flex; flex-direction:column; gap:12px; }
  button { background:var(--accent); color:#04120a; border:0; border-radius:8px; padding:10px 14px;
           font-size:16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .bar { height:18px; background:#374151; border-radius:4px; overflow:hidden; flex:1; }
  .bar > div { height:100%; width:0; background:#60a5fa; transition:width .1s; }
  .bar.active > div { background:var(--accent); }
  .label { width:64px; font-size:14px; }
  .pct { width:44px; text-align:right; font-size:13px; color:var(--muted); }
  #status { font-size:14px; color:var(--muted); min-height:20px; }
  #dir { font-size:40px; text-align:center; }
  .score { font-size:20px; }
  small { color:var(--muted); }
</style>
</head>
<body>
<h1>🐍 포즈로 조종하는 뱀게임</h1>

<div class="wrap">
  <div class="panel">
    <div class="row" style="margin-bottom:8px">
      <span class="score">점수: <b id="score">0</b></span>
      <span class="score">최고: <b id="best">0</b></span>
    </div>
    <canvas id="game" width="480" height="480"></canvas>
  </div>

  <div class="panel side">
    <button id="camBtn">① 웹캠 + 모델 시작</button>
    <button id="startBtn" disabled>② 게임 시작</button>
    <div id="status">버튼을 눌러 웹캠을 켜세요.</div>
    <div id="webcam-container"></div>
    <div id="dir">⏺</div>
    <div id="bars"></div>
    <div class="row">
      <span style="font-size:14px">인식 임계값</span>
      <input id="threshold" type="range" min="0.5" max="0.99" step="0.01" value="0.8">
      <span id="thVal" class="pct">0.80</span>
    </div>
    <div class="row">
      <span style="font-size:14px">게임 속도</span>
      <input id="speed" type="range" min="2" max="15" step="1" value="6">
      <span id="spVal" class="pct">6</span>
    </div>
    <small>임계값 이상으로 확실한 동작만 방향을 바꿉니다. 그 외(또는 neutral)는 현재 방향 유지.
      키보드 방향키로도 조작할 수 있어요.</small>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
<script>
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/4EMesv2eO/";

// ---------- 포즈 인식 ----------
let model, webcam, camCtx, labels = [];
const barEls = {};
const DIRS = {
  up:    { x: 0, y: -1, icon: "⬆️" },
  down:  { x: 0, y: 1,  icon: "⬇️" },
  left:  { x: -1, y: 0, icon: "⬅️" },
  right: { x: 1, y: 0,  icon: "➡️" },
};
const statusEl = document.getElementById("status");
const dirEl = document.getElementById("dir");
const thEl = document.getElementById("threshold");
const spEl = document.getElementById("speed");
thEl.oninput = () => document.getElementById("thVal").textContent = (+thEl.value).toFixed(2);
spEl.oninput = () => document.getElementById("spVal").textContent = spEl.value;

document.getElementById("camBtn").onclick = async (e) => {
  e.target.disabled = true;
  try {
    statusEl.textContent = "모델 불러오는 중...";
    model = await tmPose.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    labels = model.getClassLabels();

    statusEl.textContent = "웹캠 켜는 중...";
    webcam = new tmPose.Webcam(268, 200, true); // flip = 거울모드
    await webcam.setup();
    await webcam.play();

    const canvas = document.createElement("canvas");
    canvas.width = 268; canvas.height = 200;
    camCtx = canvas.getContext("2d");
    document.getElementById("webcam-container").appendChild(canvas);

    const bars = document.getElementById("bars");
    for (const l of labels) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="label">${l}</span><div class="bar"><div></div></div><span class="pct">0%</span>`;
      bars.appendChild(row);
      barEls[l] = row;
    }
    statusEl.textContent = "준비 완료! 클래스: " + labels.join(", ");
    document.getElementById("startBtn").disabled = false;
    requestAnimationFrame(predictLoop);
  } catch (err) {
    console.error(err);
    statusEl.textContent = "오류: " + err.message;
    e.target.disabled = false;
  }
};

let stableLabel = null, stableCount = 0;
const STABLE_FRAMES = 3; // 같은 결과가 연속 N프레임 나와야 적용 (흔들림 방지)

async function predictLoop() {
  webcam.update();
  const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
  const preds = await model.predict(posenetOutput);

  let best = preds[0];
  for (const p of preds) if (p.probability > best.probability) best = p;

  for (const p of preds) {
    const row = barEls[p.className];
    row.querySelector(".bar > div").style.width = (p.probability * 100) + "%";
    row.querySelector(".pct").textContent = Math.round(p.probability * 100) + "%";
    row.querySelector(".bar").classList.toggle("active", p === best);
  }

  const name = best.className.toLowerCase().trim();
  if (best.probability >= +thEl.value && DIRS[name]) {
    stableCount = (stableLabel === name) ? stableCount + 1 : 1;
    stableLabel = name;
    if (stableCount >= STABLE_FRAMES) setDirection(name);
  } else {
    stableLabel = null; stableCount = 0; // neutral 또는 불확실 → 방향 유지
  }

  camCtx.drawImage(webcam.canvas, 0, 0);
  if (pose) {
    tmPose.drawKeypoints(pose.keypoints, 0.5, camCtx);
    tmPose.drawSkeleton(pose.keypoints, 0.5, camCtx);
  }
  requestAnimationFrame(predictLoop);
}

// ---------- 뱀게임 ----------
const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");
const N = 20, CELL = cvs.width / N;
let snake, dir, nextDir, food, score, running = false, lastTick = 0;
let best = +(localStorage.getItem("snakeBest") || 0);
document.getElementById("best").textContent = best;

function setDirection(name) {
  const d = DIRS[name];
  const cur = nextDir || dir;
  if (!cur) return;
  if (d.x === -cur.x && d.y === -cur.y) return; // 정반대 방향 금지
  nextDir = d;
  dirEl.textContent = d.icon;
}

function resetGame() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = DIRS.right; nextDir = DIRS.right;
  dirEl.textContent = DIRS.right.icon;
  score = 0;
  document.getElementById("score").textContent = 0;
  placeFood();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById("score").textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
}

function gameOver() {
  running = false;
  if (score > best) {
    best = score;
    try { localStorage.setItem("snakeBest", best); } catch {}
    document.getElementById("best").textContent = best;
  }
  draw();
  ctx.fillStyle = "rgba(0,0,0,.6)";
  ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.font = "bold 36px system-ui";
  ctx.fillText("GAME OVER", cvs.width / 2, cvs.height / 2 - 10);
  ctx.font = "18px system-ui";
  ctx.fillText(`점수 ${score} · 다시 시작하려면 버튼 또는 Space`, cvs.width / 2, cvs.height / 2 + 24);
  document.getElementById("startBtn").textContent = "② 다시 시작";
}

function draw() {
  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.strokeStyle = "#162033";
  for (let i = 0; i <= N; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, cvs.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(cvs.width, i * CELL); ctx.stroke();
  }
  ctx.fillStyle = "#ef4444";
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#86efac" : "#22c55e";
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });
}

function loop(t) {
  if (!running) return;
  if (t - lastTick >= 1000 / +spEl.value) {
    lastTick = t;
    step();
    if (running) draw();
  }
  requestAnimationFrame(loop);
}

function startGame() {
  resetGame();
  draw();
  running = true;
  lastTick = performance.now();
  requestAnimationFrame(loop);
}

document.getElementById("startBtn").onclick = (e) => { e.target.blur(); if (!running) startGame(); };

document.addEventListener("keydown", (e) => {
  const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
  if (map[e.key]) { e.preventDefault(); setDirection(map[e.key]); }
  if (e.code === "Space" && !running) { e.preventDefault(); startGame(); }
});

// 초기 화면
resetGame();
draw();
</script>
</body>
</html>
